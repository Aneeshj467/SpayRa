<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Products - SpayRa</title>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' class='bi bi-gem' viewBox='0 0 16 16'><path d='M3.1.7a.5.5 0 0 1 .4-.2h9a.5.5 0 0 1 .4.2l2.976 3.974c.149.185.156.45.01.644L8.4 15.3a.5.5 0 0 1-.8 0L.1 5.118a.5.5 0 0 1 .01-.644L3.1.7zm11.386 3.785-1.806-2.41-.776 2.413 2.582-.003zm-3.633.004.961-2.989H4.186l.963 2.995 5.704-.006zM5.47 5.495 8 13.366l2.532-7.876-5.062.005zm-1.371-.999-.78-2.422-1.818 2.425 2.598-.003zM1.499 5.5l5.113 6.817-2.192-6.82L1.5 5.5zm7.889 6.817 5.123-6.83-2.928.002L13.387 12.317z'/></svg>" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      :root {
        --primary: #FFD700;
        --primary-dark: #DAA520;
        --secondary: #FFF8DC;
        --accent: #B8860B;
        --dark: #000000;
        --light: #1a1a1a;
        --gray: #CCCCCC;
        --gray-light: #2a2a2a;
        --body-bg: #000000;
        --card-bg: #1a1a1a;
        --border: #333333;
        --cream: #FFFFFF;
        --box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
        --box-shadow-lg: 0 20px 40px rgba(255, 215, 0, 0.25);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      body {
        font-family: 'Montserrat', sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--body-bg);
        color: var(--cream);
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
        animation: float 25s ease-in-out infinite;
        pointer-events: none;
        z-index: -1;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(180deg); }
      }

      .navbar {
        background: linear-gradient(135deg, rgba(0,0,0,0.95) 0%, rgba(26,26,26,0.95) 100%) !important;
        backdrop-filter: blur(20px);
        box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
        border-bottom: 1px solid var(--border);
      }

      .navbar-brand {
        font-weight: 800;
        color: var(--primary) !important;
        font-size: 2rem;
        font-family: 'Playfair Display', serif;
        transition: var(--transition);
        text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
      }

      .navbar-brand:hover {
        transform: scale(1.05);
        color: var(--primary-dark) !important;
      }

      .nav-link {
        font-weight: 600;
        color: var(--gray) !important;
        transition: var(--transition);
        position: relative;
      }

      .nav-link:hover {
        color: var(--primary) !important;
        transform: translateY(-2px);
      }

      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -5px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--primary);
        transition: var(--transition);
        transform: translateX(-50%);
      }

      .nav-link:hover::after {
        width: 80%;
      }

      .hero {
        background: linear-gradient(135deg, var(--card-bg) 0%, var(--gray-light) 100%);
        padding: 6rem 0;
        color: var(--cream);
        position: relative;
        overflow: hidden;
      }

      .hero::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -50%;
        width: 100%;
        height: 200%;
        background: radial-gradient(circle, rgba(255, 215, 0, 0.1) 0%, transparent 70%);
        animation: pulse 4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }

      .hero h1 {
        font-weight: 800;
        margin-bottom: 1.5rem;
        color: var(--cream);
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        position: relative;
        z-index: 1;
        font-family: 'Playfair Display', serif;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero .lead {
        font-size: 1.5rem;
        margin-bottom: 2rem;
        position: relative;
        z-index: 1;
        font-weight: 600;
        color: var(--gray);
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: var(--dark);
        padding: 1.2rem 3rem;
        border-radius: 25px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: var(--transition);
        border: none;
        box-shadow: var(--box-shadow);
        position: relative;
        overflow: hidden;
      }

      .btn-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s;
      }

      .btn-primary:hover::before {
        left: 100%;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent) 100%);
        transform: translateY(-3px);
        box-shadow: var(--box-shadow-lg);
        color: var(--dark);
      }

      .btn-danger {
        background: linear-gradient(135deg, #FF3D00 0%, #D32F2F 100%);
        border-radius: 25px;
        padding: 0.75rem 2rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: var(--transition);
        border: none;
        box-shadow: 0 4px 15px rgba(255, 61, 0, 0.3);
        color: var(--cream);
      }

      .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 61, 0, 0.4);
        color: var(--cream);
      }

      .btn-secondary {
        background: linear-gradient(135deg, var(--gray-light) 0%, var(--border) 100%);
        color: var(--cream);
        padding: 1rem 2.5rem;
        border-radius: 25px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: var(--transition);
        border: none;
        box-shadow: 0 4px 15px rgba(51, 51, 51, 0.3);
      }

      .btn-secondary:hover {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(255, 215, 0, 0.3);
        color: var(--dark);
      }

      .featured-products {
        background-color: var(--body-bg);
        padding: 4rem 0;
      }

      .featured-products h2 {
        color: var(--cream);
        font-weight: 800;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        font-family: 'Playfair Display', serif;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .footer {
        background: var(--dark);
        color: var(--cream);
        padding: 2rem 0;
        text-align: center;
        margin-top: auto;
        border-top: 1px solid var(--border);
      }

      .alert {
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        border: none;
      }

      .alert-danger {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
        color: var(--cream);
        border-left: 4px solid #EF4444;
      }

      .alert-success {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
        color: var(--cream);
        border-left: 4px solid #10B981;
      }

      main {
        flex: 1 0 auto;
      }

      .product-card {
        transition: var(--transition);
        margin-bottom: 30px;
        height: 550px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: var(--box-shadow);
        background: var(--card-bg);
        border: 2px solid var(--border);
        position: relative;
      }

      .product-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
        transition: left 0.5s;
      }

      .product-card:hover::before {
        left: 100%;
      }

      .product-card:hover {
        transform: translateY(-8px);
        box-shadow: var(--box-shadow-lg);
        border-color: var(--primary);
      }

      .product-image {
        width: 100%;
        height: 220px;
        object-fit: contain;
        background: var(--gray-light);
        padding: 15px;
      }

      .card-body {
        background: var(--card-bg);
        color: var(--cream);
        padding: 1.5rem;
      }

      .card-title {
        color: var(--cream);
        font-weight: 700;
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        margin-bottom: 1rem;
      }

      .card-text {
        color: var(--gray);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 1rem;
      }

      .badge {
        background: var(--primary) !important;
        color: var(--dark) !important;
        font-weight: 600;
        padding: 0.5rem 1rem;
        border-radius: 15px;
        font-size: 0.8rem;
      }

      .price-tag {
        color: var(--primary);
        font-weight: 800;
        font-size: 1.3rem;
        font-family: 'Playfair Display', serif;
      }

      .stock-info {
        color: var(--gray);
        font-size: 0.9rem;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .hero {
          padding: 4rem 0;
        }
        .hero h1 {
          font-size: 2.5rem;
        }
        .hero .lead {
          font-size: 1.2rem;
        }
        .navbar-brand {
          font-size: 1.6rem;
        }
        .product-card {
          height: auto;
          margin-bottom: 20px;
        }
        .product-image {
          height: 180px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="/seller/home">
            <i class="bi bi-gem me-2"></i>SpayRa Seller
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="/seller/add-product"><i class="bi bi-plus-circle me-1"></i>Add Product</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/seller/manage-products"><i class="bi bi-gear me-1"></i>Manage Products</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container mt-4" th:if="${session.failure!=null || session.success!=null}">
        <div class="alert alert-danger alert-dismissible fade show" th:if="${session.failure}" role="alert">
          <i class="bi bi-exclamation-triangle me-2"></i>
          <span th:text="${session.failure}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div class="alert alert-success alert-dismissible fade show" th:if="${session.success}" role="alert">
          <i class="bi bi-check-circle me-2"></i>
          <span th:text="${session.success}"></span>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:text="${@sessionMessageRemover.removeMessage()}"></div>
      </div>
      <section class="hero text-center">
        <div class="container">
          <h1 class="display-4">Luxury Collection Management</h1>
          <p class="lead">View and manage your premium product inventory</p>
        </div>
      </section>
      <section class="featured-products py-5">
        <div class="container">
          <div class="row">
            <div class="col-md-4" th:each="product:${products}">
              <div class="card product-card">
                <img class="card-img-top product-image" th:src="${product.imageLink}" th:alt="${product.name}" />
                <div class="card-body">
                  <h5 class="card-title" th:text="${product.name}"></h5>
                  <p class="card-text" th:text="${product.description}"></p>
                  <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-primary" th:text="${product.category}"></span>
                    <span class="price-tag" th:text="'₹' + ${product.price}"></span>
                  </div>
                  <p class="stock-info">
                    <i class="bi bi-box me-1"></i>
                    <small th:text="'Stock: ' + ${product.stock}"></small>
                  </p>
                  <div class="d-flex gap-2">
                    <a th:href="'/seller/edit-product/'+${product.id}" class="btn btn-primary flex-grow-1"><i class="bi bi-pencil-square me-1"></i>Edit</a>
                    <a th:href="'/seller/delete-product/'+${product.id}" class="btn btn-danger flex-grow-1"><i class="bi bi-trash me-1"></i>Delete</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="text-center mt-4 mb-4">
            <a href="/seller/home" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="container">
        <p class="mb-0">
          <i class="bi bi-c-circle me-1"></i>2025 SpayRa. Luxury Redefined.
        </p>
      </div>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var alerts = document.querySelectorAll(".alert");
          alerts.forEach(function (alert) {
            var bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
          });
        }, 2000);
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
