<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Registration - SpayRa</title>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' class='bi bi-gem' viewBox='0 0 16 16'><path d='M3.1.7a.5.5 0 0 1 .4-.2h9a.5.5 0 0 1 .4.2l2.976 3.974c.149.185.156.45.01.644L8.4 15.3a.5.5 0 0 1-.8 0L.1 5.118a.5.5 0 0 1 .01-.644L3.1.7zm11.386 3.785-1.806-2.41-.776 2.413 2.582-.003zm-3.633.004.961-2.989H4.186l.963 2.995 5.704-.006zM5.47 5.495 8 13.366l2.532-7.876-5.062.005zm-1.371-.999-.78-2.422-1.818 2.425 2.598-.003zM1.499 5.5l5.113 6.817-2.192-6.82L1.5 5.5zm7.889 6.817 5.123-6.83-2.928.002L13.387 12.317z'/></svg>" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
    :root {
        --primary: #FFD700;
        --primary-dark: #DAA520;
        --secondary: #FFF8DC;
        --accent: #B8860B;
        --dark: #000000;
        --light: #1a1a1a;
        --gray: #CCCCCC;
        --gray-light: #2a2a2a;
        --body-bg: #000000;
        --card-bg: #1a1a1a;
        --border: #333333;
        --cream: #FFFFFF;
        --box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
        --box-shadow-lg: 0 20px 40px rgba(255, 215, 0, 0.25);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --success-color: #10B981;
        --error-color: #EF4444;
    }
      
    body {
        font-family: 'Montserrat', sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--body-bg);
        color: var(--cream);
        position: relative;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
        animation: backgroundFloat 20s ease-in-out infinite;
        pointer-events: none;
        z-index: -1;
    }

    @keyframes backgroundFloat {
        0%, 100% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
    }

    .navbar {
        background: linear-gradient(135deg, rgba(0,0,0,0.95) 0%, rgba(26,26,26,0.95) 100%) !important;
        backdrop-filter: blur(20px);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
    }
      
    .navbar-brand {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        color: var(--primary) !important;
        font-size: 2rem;
        text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
        transition: var(--transition);
    }

    .navbar-brand:hover {
        transform: scale(1.05);
        color: var(--primary-dark) !important;
    }
      
    .nav-link {
        font-weight: 600;
        color: var(--gray) !important;
        transition: var(--transition);
        position: relative;
    }

    .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -5px;
        left: 50%;
        background: var(--primary);
        transition: var(--transition);
        transform: translateX(-50%);
    }
      
    .nav-link:hover {
        color: var(--primary) !important;
        transform: translateY(-2px);
    }

    .nav-link:hover::after {
        width: 100%;
    }
      
    .footer {
        background: var(--dark);
        color: var(--cream);
        padding: 2rem 0;
        text-align: center;
        margin-top: auto;
        position: relative;
        overflow: hidden;
        border-top: 1px solid var(--border);
    }

    .footer::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0% { left: -100%; }
        100% { left: 100%; }
    }
      
    main {
        flex: 1 0 auto;
        padding: 2rem 0;
    }
      
    .form-container {
        max-width: 700px;
        margin: 0 auto;
        padding: 4rem 3rem;
        background: var(--card-bg);
        border-radius: 25px;
        box-shadow: var(--box-shadow-lg);
        position: relative;
        overflow: hidden;
        animation: slideInUp 0.8s ease-out;
        border: 2px solid var(--border);
    }

    .form-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--primary-dark));
    }

    @keyframes slideInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-label {
        font-weight: 700;
        color: var(--cream);
        margin-bottom: 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1rem;
    }

    .form-control {
        border: 2px solid var(--border);
        border-radius: 15px;
        padding: 1rem 1.2rem;
        font-size: 1rem;
        transition: var(--transition);
        background: var(--gray-light);
        color: var(--cream);
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.3rem rgba(255, 215, 0, 0.25);
        background: var(--card-bg);
        transform: translateY(-2px);
        color: var(--cream);
    }

    .form-control:hover {
        border-color: var(--primary);
        background: var(--card-bg);
    }

    .form-control::placeholder {
        color: var(--gray);
    }
      
    .btn-primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: var(--dark);
        padding: 1.2rem 3rem;
        border-radius: 25px;
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: var(--transition);
        border: none;
        box-shadow: var(--box-shadow);
        position: relative;
        overflow: hidden;
        font-size: 1.1rem;
    }

    .btn-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s;
    }

    .btn-primary:hover::before {
        left: 100%;
    }
      
    .btn-primary:hover {
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent) 100%);
        transform: translateY(-3px);
        box-shadow: var(--box-shadow-lg);
        color: var(--dark);
    }

    .btn-primary:active {
        transform: translateY(-1px);
    }
      
    .alert {
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        border: none;
        animation: slideInDown 0.5s ease-out;
    }

    .alert-success {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
        color: var(--cream);
        border-left: 4px solid var(--success-color);
    }

    .alert-danger {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
        color: var(--cream);
        border-left: 4px solid var(--error-color);
    }

    @keyframes slideInDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .page-title {
        font-family: 'Playfair Display', serif;
        color: var(--cream);
        font-weight: 800;
        text-align: center;
        margin-bottom: 3rem;
        font-size: 3rem;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 1s ease-out;
        position: relative;
    }

    .page-title::after {
        content: '';
        position: absolute;
        bottom: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 4px;
        background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
        border-radius: 2px;
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .register-link {
        color: var(--primary);
        font-weight: 700;
        text-decoration: none;
        transition: var(--transition);
        position: relative;
    }

    .register-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -2px;
        left: 0;
        background: var(--primary-dark);
        transition: width 0.3s ease;
    }

    .register-link:hover {
        color: var(--primary-dark);
        transform: translateX(5px);
    }

    .register-link:hover::after {
        width: 100%;
    }

    .input-group {
        position: relative;
    }

    .input-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--primary);
        z-index: 10;
        pointer-events: none;
    }

    .btn-loading {
        position: relative;
        color: transparent;
    }

    .btn-loading::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin-left: -10px;
        margin-top: -10px;
        border: 2px solid var(--dark);
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    .text-danger {
        color: var(--error-color) !important;
        font-weight: 600;
        font-size: 0.9rem;
        margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
        .form-container {
            margin: 1rem;
            padding: 2.5rem 2rem;
        }
        
        .page-title {
            font-size: 2.2rem;
        }
        
        .navbar-brand {
            font-size: 1.6rem;
        }
    }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="/">
            <i class="bi bi-gem me-2"></i>SpayRa
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="/login">
                  <i class="bi bi-box-arrow-in-right me-1"></i>Login
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/customer/register">
                  <i class="bi bi-person-plus me-1"></i>Register
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div
        class="container mt-4"
        th:if="${session.failure!=null || session.success!=null}"
      >
        <div
          class="alert alert-danger alert-dismissible fade show"
          th:if="${session.failure}"
          role="alert"
        >
          <i class="bi bi-exclamation-triangle me-2"></i>
          <span th:text="${session.failure}"></span>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>
        <div
          class="alert alert-success alert-dismissible fade show"
          th:if="${session.success}"
          role="alert"
        >
          <i class="bi bi-check-circle me-2"></i>
          <span th:text="${session.success}"></span>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="alert"
            aria-label="Close"
          ></button>
        </div>
        <div th:text="${@sessionMessageRemover.removeMessage()}"></div>
      </div>

      <div class="container mt-4">
        <h1 class="page-title">
          <i class="bi bi-gem me-3"></i>
          Join the Luxury Experience
        </h1>

        <div class="form-container">
          <form
            action="/customer/register"
            method="post"
            th:object="${customer}"
            id="registrationForm"
          >
            <div class="mb-4">
              <label for="name" class="form-label">
                <i class="bi bi-person"></i>Full Name
              </label>
              <div class="input-group">
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  th:value="*{name}"
                  placeholder="Enter your distinguished name"
                />
                <i class="bi bi-person input-icon"></i>
              </div>
              <span class="text-danger" th:errors="*{name}"></span>
            </div>

            <div class="mb-4">
              <label for="mobile" class="form-label">
                <i class="bi bi-phone"></i>Mobile Number
              </label>
              <div class="input-group">
                <input
                  type="tel"
                  class="form-control"
                  id="mobile"
                  name="mobile"
                  th:value="*{mobile}"
                  placeholder="Enter your exclusive contact number"
                />
                <i class="bi bi-phone input-icon"></i>
              </div>
              <span class="text-danger" th:errors="*{mobile}"></span>
            </div>

            <div class="mb-4">
              <label for="email" class="form-label">
                <i class="bi bi-envelope"></i>Email Address
              </label>
              <div class="input-group">
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  th:value="*{email}"
                  placeholder="Enter your premium email address"
                />
                <i class="bi bi-envelope input-icon"></i>
              </div>
              <span class="text-danger" th:errors="*{email}"></span>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">
                <i class="bi bi-lock"></i>Password
              </label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  th:value="*{password}"
                  placeholder="Create a secure luxury password"
                />
                <i class="bi bi-lock input-icon"></i>
              </div>
              <span class="text-danger" th:errors="*{password}"></span>
            </div>

            <div class="mb-4">
              <label for="confirmpassword" class="form-label">
                <i class="bi bi-lock-fill"></i>Confirm Password
              </label>
              <div class="input-group">
                <input
                  type="password"
                  class="form-control"
                  id="confirmpassword"
                  name="confirmpassword"
                  th:value="*{confirmpassword}"
                  placeholder="Confirm your luxury password"
                />
                <i class="bi bi-lock-fill input-icon"></i>
              </div>
              <span class="text-danger" th:errors="*{confirmpassword}"></span>
            </div>

            <div class="mb-4">
              <label for="address" class="form-label">
                <i class="bi bi-geo-alt"></i>Address
              </label>
              <div class="input-group">
                <textarea
                  class="form-control"
                  id="address"
                  name="address"
                  rows="4"
                  th:text="*{address}"
                  placeholder="Enter your prestigious address for luxury deliveries"
                ></textarea>
                <i class="bi bi-geo-alt input-icon" style="top: 20px;"></i>
              </div>
              <span class="text-danger" th:errors="*{address}"></span>
            </div>

            <div class="text-center mb-4">
              <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="bi bi-gem me-2"></i>Create Luxury Account
              </button>
            </div>
          </form>

          <div class="text-center">
            <p class="mb-0" style="color: var(--gray);">
              Want to register as a Premium Seller?
              <a href="/seller/register" class="register-link ms-2">
                <i class="bi bi-shop me-1"></i>Join Our Elite Partners
              </a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p class="mb-0">
          <i class="bi bi-c-circle me-1"></i>2025 SpayRa. Luxury Redefined.
          <span class="ms-3">
            <i class="bi bi-shield-check me-1"></i>Secure & Exclusive
          </span>
        </p>
      </div>
    </footer>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Auto-dismiss alerts
        setTimeout(function () {
          var alerts = document.querySelectorAll(".alert");
          alerts.forEach(function (alert) {
            var bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
          });
        }, 5000);

        // Form submission animation
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        
        form.addEventListener('submit', function() {
          submitBtn.classList.add('btn-loading');
          submitBtn.disabled = true;
        });

        // Input field animations
        const inputs = document.querySelectorAll('.form-control');
        inputs.forEach(input => {
          input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
          });
          
          input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
          });
        });

        // Stagger animation for form fields
        const formGroups = document.querySelectorAll('.mb-4');
        formGroups.forEach((group, index) => {
          group.style.opacity = '0';
          group.style.transform = 'translateY(20px)';
          
          setTimeout(() => {
            group.style.transition = 'all 0.5s ease';
            group.style.opacity = '1';
            group.style.transform = 'translateY(0)';
          }, index * 100);
        });
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
