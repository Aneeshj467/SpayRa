<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | SpayRa</title>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' class='bi bi-gem' viewBox='0 0 16 16'><path d='M3.1.7a.5.5 0 0 1 .4-.2h9a.5.5 0 0 1 .4.2l2.976 3.974c.149.185.156.45.01.644L8.4 15.3a.5.5 0 0 1-.8 0L.1 5.118a.5.5 0 0 1 .01-.644L3.1.7zm11.386 3.785-1.806-2.41-.776 2.413 2.582-.003zm-3.633.004.961-2.989H4.186l.963 2.995 5.704-.006zM5.47 5.495 8 13.366l2.532-7.876-5.062.005zm-1.371-.999-.78-2.422-1.818 2.425 2.598-.003zM1.499 5.5l5.113 6.817-2.192-6.82L1.5 5.5zm7.889 6.817 5.123-6.83-2.928.002L13.387 12.317z'/></svg>" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;800&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      :root {
        --primary: #FFD700;
        --primary-dark: #DAA520;
        --secondary: #FFF8DC;
        --accent: #B8860B;
        --dark: #000000;
        --light: #1a1a1a;
        --gray: #CCCCCC;
        --gray-light: #2a2a2a;
        --body-bg: #000000;
        --card-bg: #1a1a1a;
        --border: #333333;
        --cream: #FFFFFF;
        --box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
        --box-shadow-lg: 0 20px 40px rgba(255, 215, 0, 0.25);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      body {
        font-family: 'Montserrat', sans-serif;
        min-height: 100vh;
        margin: 0;
        background: var(--dark);
        display: flex;
        flex-direction: column;
        position: relative;
        overflow-x: hidden;
        color: var(--cream);
      }
      
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }
      
      .floating-shape {
        position: absolute;
        border-radius: 50%;
        opacity: 0.1;
        animation: float 6s ease-in-out infinite;
      }
      
      .shape-1 {
        width: 200px;
        height: 200px;
        background: var(--primary);
        top: 10%;
        left: 10%;
        animation-delay: 0s;
      }
      
      .shape-2 {
        width: 150px;
        height: 150px;
        background: var(--primary-dark);
        top: 60%;
        right: 15%;
        animation-delay: 2s;
      }
      
      .shape-3 {
        width: 100px;
        height: 100px;
        background: var(--accent);
        bottom: 20%;
        left: 20%;
        animation-delay: 4s;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        33% { transform: translateY(-20px) rotate(120deg); }
        66% { transform: translateY(10px) rotate(240deg); }
      }
      
      .navbar {
        background: rgba(0, 0, 0, 0.95) !important;
        backdrop-filter: blur(15px);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
      }
      
      .navbar-brand {
        font-family: 'Playfair Display', serif;
        font-weight: 800;
        color: var(--primary) !important;
        font-size: 2rem;
        text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
        transition: var(--transition);
      }
      
      .navbar-brand:hover {
        transform: scale(1.05);
        color: var(--primary-dark) !important;
      }
      
      .nav-link {
        font-weight: 600;
        color: var(--gray) !important;
        transition: var(--transition);
        position: relative;
      }
      
      .nav-link:hover {
        color: var(--primary) !important;
        transform: translateY(-2px);
      }
      
      .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: -5px;
        left: 50%;
        background: var(--primary);
        transition: var(--transition);
        transform: translateX(-50%);
      }
      
      .nav-link:hover::after {
        width: 100%;
      }
      
      .error-section {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        min-height: calc(100vh - 140px);
        padding: 2rem 0;
      }
      
      .error-content {
        text-align: center;
        position: relative;
        z-index: 2;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        padding: 4rem 3rem;
        border-radius: 30px;
        box-shadow: var(--box-shadow-lg);
        border: 2px solid var(--border);
        max-width: 600px;
        margin: 0 auto;
      }
      
      .error-number {
        font-family: 'Playfair Display', serif;
        font-size: 8rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
        line-height: 1;
        animation: bounce 2s ease-in-out infinite;
        text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      }
      
      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
        60% { transform: translateY(-5px); }
      }
      
      .error-message {
        font-family: 'Playfair Display', serif;
        font-size: 2rem;
        color: var(--cream);
        margin: 2rem 0;
        font-weight: 700;
      }
      
      .error-description {
        font-size: 1.1rem;
        color: var(--gray);
        margin-bottom: 3rem;
        line-height: 1.6;
      }
      
      .home-button {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: var(--dark);
        padding: 1.2rem 3rem;
        border-radius: 25px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: var(--transition);
        border: none;
        box-shadow: var(--box-shadow);
        position: relative;
        overflow: hidden;
        text-decoration: none;
        display: inline-block;
      }
      
      .home-button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
      }
      
      .home-button:hover::before {
        left: 100%;
      }
      
      .home-button:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: var(--box-shadow-lg);
        color: var(--dark);
        text-decoration: none;
      }
      
      .footer {
        background: var(--dark);
        color: var(--cream);
        padding: 2rem 0;
        text-align: center;
        margin-top: auto;
        border-top: 1px solid var(--border);
      }
      
      .footer::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--primary), var(--primary-dark), var(--primary));
      }
      
      .footer-content {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      
      .footer-logo {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        color: var(--primary);
      }
      
      @media (max-width: 768px) {
        .error-number {
          font-size: 6rem;
        }
        
        .error-message {
          font-size: 1.5rem;
        }
        
        .error-content {
          padding: 2rem;
          margin: 1rem;
        }
        
        .navbar-brand {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-animation">
      <div class="floating-shape shape-1"></div>
      <div class="floating-shape shape-2"></div>
      <div class="floating-shape shape-3"></div>
    </div>

    <header>
      <nav class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="/">
            <i class="bi bi-gem me-2"></i>SpayRa
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link" href="/login">
                  <i class="bi bi-box-arrow-in-right me-1"></i>Login
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/customer/register">
                  <i class="bi bi-person-plus me-1"></i>Register
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="error-section">
        <div class="container">
          <div class="error-content">
            <h1 class="error-number">404</h1>
            <p class="error-message">Oops! Page Not Found</p>
            <p class="error-description">
              The luxury experience you're looking for seems to have wandered off. Let's get you back to our premium collection.
            </p>
            <a href="/" class="home-button">
              <i class="bi bi-gem me-2"></i>Return to Luxury
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <span class="footer-logo">
            <i class="bi bi-gem me-1"></i>SpayRa
          </span>
          <span>|</span>
          <span>
            <i class="bi bi-c-circle me-1"></i>2025 All rights reserved.
          </span>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
