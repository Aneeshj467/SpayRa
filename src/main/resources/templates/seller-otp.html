<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter OTP - SpayRa Seller Portal</title>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' class='bi bi-gem' viewBox='0 0 16 16'><path d='M3.1.7a.5.5 0 0 1 .4-.2h9a.5.5 0 0 1 .4.2l2.976 3.974c.149.185.156.45.01.644L8.4 15.3a.5.5 0 0 1-.8 0L.1 5.118a.5.5 0 0 1 .01-.644L3.1.7zm11.386 3.785-1.806-2.41-.776 2.413 2.582-.003zm-3.633.004.961-2.989H4.186l.963 2.995 5.704-.006zM5.47 5.495 8 13.366l2.532-7.876-5.062.005zm-1.371-.999-.78-2.422-1.818 2.425 2.598-.003zM1.499 5.5l5.113 6.817-2.192-6.82L1.5 5.5zm7.889 6.817 5.123-6.83-2.928.002L13.387 12.317z'/></svg>" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      :root {
        --primary: #FFD700;
        --primary-dark: #DAA520;
        --secondary: #FFF8DC;
        --accent: #B8860B;
        --dark: #000000;
        --light: #1a1a1a;
        --gray: #CCCCCC;
        --gray-light: #2a2a2a;
        --body-bg: #000000;
        --card-bg: #1a1a1a;
        --border: #333333;
        --cream: #FFFFFF;
        --box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
        --box-shadow-lg: 0 20px 40px rgba(255, 215, 0, 0.25);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --success-color: #10B981;
        --error-color: #EF4444;
      }
      
      body {
        font-family: 'Montserrat', sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--body-bg);
        color: var(--cream);
        position: relative;
        overflow-x: hidden;
      }
      
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
        pointer-events: none;
        z-index: -1;
      }
      
      .bg-animation {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
        overflow: hidden;
      }
      
      .floating-icon {
        position: absolute;
        opacity: 0.1;
        font-size: 2rem;
        color: var(--primary);
        animation: float-icon 8s ease-in-out infinite;
      }
      
      .icon-1 { top: 15%; left: 10%; animation-delay: 0s; }
      .icon-2 { top: 25%; right: 15%; animation-delay: 2s; }
      .icon-3 { bottom: 30%; left: 20%; animation-delay: 4s; }
      .icon-4 { bottom: 15%; right: 25%; animation-delay: 6s; }
      
      @keyframes float-icon {
        0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.1; }
        50% { transform: translateY(-30px) rotate(180deg); opacity: 0.2; }
      }
      
      main {
        flex: 1 0 auto;
        display: flex;
        align-items: center;
        padding: 2rem 0;
      }
      
      .form-container {
        max-width: 500px;
        width: 100%;
        margin: 0 auto;
        padding: 4rem 3rem;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        box-shadow: var(--box-shadow-lg);
        border: 2px solid var(--border);
        position: relative;
        overflow: hidden;
      }
      
      .form-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--primary-dark), var(--primary));
      }
      
      .spayra-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      
      .spayra-logo {
        font-family: 'Playfair Display', serif;
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
        animation: shimmer 3s ease-in-out infinite;
      }
      
      @keyframes shimmer {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.2); }
      }
      
      .seller-badge {
        display: inline-block;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--dark);
        padding: 0.5rem 1.5rem;
        border-radius: 25px;
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      h1 {
        font-family: 'Playfair Display', serif;
        color: var(--cream);
        font-weight: 700;
        margin: 2rem 0 1.5rem;
        position: relative;
        text-align: center;
        font-size: 2rem;
      }
      
      .security-info {
        background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(218, 165, 32, 0.1));
        border: 2px solid rgba(255, 215, 0, 0.3);
        border-radius: 15px;
        padding: 1.5rem;
        margin-bottom: 2rem;
        text-align: center;
      }
      
      .security-info i {
        color: var(--primary);
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }
      
      .security-info p {
        margin: 0;
        font-size: 1rem;
        color: var(--gray);
        font-weight: 600;
      }
      
      .form-label {
        font-weight: 700;
        color: var(--cream);
        margin-bottom: 1rem;
        font-size: 1.1rem;
      }
      
      .form-control {
        border-radius: 15px;
        border: 2px solid var(--border);
        padding: 1.2rem;
        font-size: 1.5rem;
        text-align: center;
        letter-spacing: 0.3rem;
        transition: var(--transition);
        background: var(--gray-light);
        color: var(--cream);
        font-weight: 700;
      }
      
      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.3rem rgba(255, 215, 0, 0.25);
        background: var(--card-bg);
        transform: scale(1.02);
        color: var(--cream);
      }
      
      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: var(--dark);
        padding: 1.2rem 3rem;
        border-radius: 25px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: var(--transition);
        border: none;
        box-shadow: var(--box-shadow);
        position: relative;
        overflow: hidden;
        width: 100%;
        font-size: 1.1rem;
      }
      
      .btn-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s;
      }
      
      .btn-primary:hover::before {
        left: 100%;
      }
      
      .btn-primary:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: var(--box-shadow-lg);
        color: var(--dark);
      }
      
      .timer-section {
        text-align: center;
        margin-top: 2rem;
        padding: 2rem;
        background: rgba(255, 215, 0, 0.05);
        border-radius: 15px;
        border: 1px solid rgba(255, 215, 0, 0.2);
      }
      
      #timer {
        color: var(--cream);
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      
      .timer-icon {
        animation: tick 1s ease-in-out infinite;
        color: var(--primary);
      }
      
      @keyframes tick {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      #resendLink button {
        background: linear-gradient(135deg, var(--primary-dark), var(--accent));
        color: var(--dark);
        padding: 1rem 2.5rem;
        border-radius: 25px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: var(--transition);
        border: none;
        box-shadow: var(--box-shadow);
      }
      
      #resendLink button:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow: var(--box-shadow-lg);
      }
      
      .alert {
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        border: none;
        padding: 1rem 1.5rem;
      }
      
      .alert-danger {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
        color: var(--cream);
        border-left: 4px solid var(--error-color);
      }
      
      .alert-success {
        background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
        color: var(--cream);
        border-left: 4px solid var(--success-color);
      }
      
      @media (max-width: 768px) {
        .form-container {
          margin: 1rem;
          padding: 2.5rem 2rem;
        }
        
        .spayra-logo {
          font-size: 2rem;
        }
        
        h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-animation">
      <i class="bi bi-shield-check floating-icon icon-1"></i>
      <i class="bi bi-lock floating-icon icon-2"></i>
      <i class="bi bi-key floating-icon icon-3"></i>
      <i class="bi bi-person-check floating-icon icon-4"></i>
    </div>

    <main>
      <div class="container">
        <div class="container mt-4" th:if="${session.failure!=null || session.success!=null}">
          <div class="alert alert-danger alert-dismissible fade show" th:if="${session.failure}" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${session.failure}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          <div class="alert alert-success alert-dismissible fade show" th:if="${session.success}" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${session.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          <div th:text="${@sessionMessageRemover.removeMessage()}"></div>
        </div>

        <div class="form-container">
          <div class="spayra-header">
            <div class="spayra-logo">
              <i class="bi bi-gem me-2"></i>SpayRa
            </div>
            <div class="seller-badge">Premium Seller Portal</div>
          </div>
          
          <h1>Verify Your Identity</h1>
          
          <div class="security-info">
            <i class="bi bi-shield-check d-block"></i>
            <p>We've sent a secure verification code to your registered device for premium seller access</p>
          </div>
          
          <div class="alert alert-danger" th:if="${failure}">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${failure}"></span>
          </div>
          
          <form th:action="'/seller/submit-otp/'+${session.id}" method="post">
            <div class="mb-4">
              <label for="otp" class="form-label">
                <i class="bi bi-key me-2"></i>Enter Verification Code
              </label>
              <input type="number" class="form-control" required id="otp" name="otp" placeholder="000000" maxlength="6" />
            </div>
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-gem me-2"></i>Verify & Access Premium
            </button>
          </form>
          
          <div class="timer-section">
            <p id="timer">
              <i class="bi bi-clock timer-icon"></i>
              <span>Resend code in: 30 seconds</span>
            </p>
            <a th:href="'/seller/resend-otp/'+${session.id}" id="resendLink" style="display: none;">
              <button>
                <i class="bi bi-arrow-clockwise me-2"></i>Resend Code
              </button>
            </a>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var timerElement = document.getElementById("timer");
        var resendLink = document.getElementById("resendLink");
        var seconds = 30;

        var countdownTimer = setInterval(function () {
          seconds--;
          timerElement.innerHTML = `
            <i class="bi bi-clock timer-icon"></i>
            <span>Resend code in: ${seconds} seconds</span>
          `;

          if (seconds <= 0) {
            clearInterval(countdownTimer);
            timerElement.style.display = "none";
            resendLink.style.display = "inline";
          }
        }, 1000);
      });
    </script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var alerts = document.querySelectorAll(".alert");
          alerts.forEach(function (alert) {
            var bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
          });
        }, 2000);
      });
    </script>
  </body>
</html>
