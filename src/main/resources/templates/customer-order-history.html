<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order History - SpayRa</title>
<link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' class='bi bi-gem' viewBox='0 0 16 16'><path d='M3.1.7a.5.5 0 0 1 .4-.2h9a.5.5 0 0 1 .4.2l2.976 3.974c.149.185.156.45.01.644L8.4 15.3a.5.5 0 0 1-.8 0L.1 5.118a.5.5 0 0 1 .01-.644L3.1.7zm11.386 3.785-1.806-2.41-.776 2.413 2.582-.003zm-3.633.004.961-2.989H4.186l.963 2.995 5.704-.006zM5.47 5.495 8 13.366l2.532-7.876-5.062.005zm-1.371-.999-.78-2.422-1.818 2.425 2.598-.003zM1.499 5.5l5.113 6.817-2.192-6.82L1.5 5.5zm7.889 6.817 5.123-6.83-2.928.002L13.387 12.317z'/></svg>" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
<style>
:root {
    --primary: #FFD700;
    --primary-dark: #DAA520;
    --secondary: #FFF8DC;
    --accent: #B8860B;
    --dark: #000000;
    --light: #1a1a1a;
    --gray: #CCCCCC;
    --gray-light: #2a2a2a;
    --body-bg: #000000;
    --card-bg: #1a1a1a;
    --border: #333333;
    --cream: #FFFFFF;
    --box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
    --box-shadow-lg: 0 20px 40px rgba(255, 215, 0, 0.25);
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
    font-family: 'Montserrat', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--body-bg);
    color: var(--cream);
    position: relative;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: -1;
}

.navbar {
    background: linear-gradient(135deg, rgba(0,0,0,0.95) 0%, rgba(26,26,26,0.95) 100%) !important;
    backdrop-filter: blur(20px);
    box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
    border-bottom: 1px solid var(--border);
}

.navbar-brand {
    font-weight: 800;
    color: var(--primary) !important;
    font-size: 2rem;
    font-family: 'Playfair Display', serif;
    text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
    transition: var(--transition);
}

.navbar-brand:hover {
    transform: scale(1.05);
    color: var(--primary-dark) !important;
}

.nav-link {
    font-weight: 600;
    color: var(--gray) !important;
    transition: var(--transition);
    position: relative;
}

.nav-link:hover {
    color: var(--primary) !important;
    transform: translateY(-2px);
}

.nav-link::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 50%;
    width: 0;
    height: 2px;
    background: var(--primary);
    transition: var(--transition);
    transform: translateX(-50%);
}

.nav-link:hover::after {
    width: 80%;
}

.order-card {
    transition: var(--transition);
    margin-bottom: 30px;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--box-shadow);
    background: var(--card-bg);
    border: 2px solid var(--border);
}

.order-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--box-shadow-lg);
    border-color: var(--primary);
}

.product-image {
    width: 80px;
    height: 80px;
    object-fit: contain;
    border-radius: 15px;
    background: var(--gray-light);
    padding: 10px;
}

.footer {
    background: var(--dark);
    color: var(--cream);
    padding: 2rem 0;
    text-align: center;
    margin-top: auto;
    border-top: 1px solid var(--border);
}

.card {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 20px;
    color: var(--cream);
}

.card-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%) !important;
    color: var(--dark) !important;
    border-bottom: 2px solid var(--border);
    font-weight: 700;
}

.card-footer {
    background: var(--gray-light) !important;
    color: var(--cream) !important;
    border-top: 2px solid var(--border);
}

h2 {
    color: var(--cream);
    font-weight: 800;
    font-family: 'Playfair Display', serif;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    margin-bottom: 2rem;
    position: relative;
}

h2::after {
    content: '';
    position: absolute;
    bottom: -10px;
    left: 0;
    width: 100px;
    height: 4px;
    background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
    border-radius: 2px;
}

h5, h6 {
    color: var(--cream);
    font-weight: 700;
}

.badge {
    background: var(--primary) !important;
    color: var(--dark) !important;
    font-weight: 600;
    padding: 0.5rem 1rem;
    border-radius: 15px;
}

.order-id {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
}

.order-total {
    color: var(--primary);
    font-weight: 800;
    font-size: 1.2rem;
}

.order-date {
    color: var(--gray);
    font-weight: 600;
}

.item-details {
    background: rgba(255, 215, 0, 0.05);
    border-radius: 15px;
    padding: 1rem;
    margin: 0.5rem 0;
    border-left: 4px solid var(--primary);
}

.payment-id {
    font-family: 'Courier New', monospace;
    background: var(--gray-light);
    padding: 0.5rem 1rem;
    border-radius: 10px;
    color: var(--primary);
    font-weight: 600;
}

@media (max-width: 768px) {
    .product-image {
        width: 60px;
        height: 60px;
    }
    
    .order-card {
        margin-bottom: 20px;
    }
    
    h2 {
        font-size: 1.8rem;
    }
}
</style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" href="/customer/home">
                    <i class="bi bi-gem me-2"></i>SpayRa
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/customer/products"><i class="bi bi-grid me-1"></i>View Products</a></li>
                        <li class="nav-item"><a class="nav-link" href="/customer/cart"><i class="bi bi-cart me-1"></i>View Cart</a></li>
                        <li class="nav-item"><a class="nav-link" href="/customer/orders"><i class="bi bi-clock-history me-1"></i>Previous Orders</a></li>
                        <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="container mt-4">
            <h2 class="mb-4"><i class="bi bi-clock-history me-3"></i>Luxury Order History</h2>
          
            <div th:each="order : ${orders}" class="card shadow-sm mb-4 order-card">
                <div class="card-header">
                    <div class="row align-items-center">
                        <div class="col-md-4">
                            <h5 class="mb-0">Order ID: <span class="order-id" th:text="${order.orderId}"></span></h5>
                        </div>
                        <div class="col-md-4">
                            <p class="mb-0 order-date">Date: <span th:text="${#temporals.format(order.orderDateTime, 'dd-MM-yyyy HH:mm')}"></span></p>
                        </div>
                        <div class="col-md-4 text-end">
                            <h6 class="mb-0 order-total">Total: ₹<span th:text="${order.totalAmount}"></span></h6>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div th:each="item : ${order.items}" class="item-details">
                        <div class="row align-items-center mb-3">
                            <div class="col-md-2">
                                <img class="product-image" th:src="${item.imageLink}" th:alt="${item.name}" />
                            </div>
                            <div class="col-md-4">
                                <h6 th:text="${item.name}"></h6>
                                <span class="badge bg-primary" th:text="${item.category}"></span>
                            </div>
                            <div class="col-md-2">
                                <p class="mb-0" style="color: var(--primary); font-weight: 600;">Price: ₹<span th:text="${item.price/item.quantity}"></span></p>
                            </div>
                            <div class="col-md-2">
                                <p class="mb-0" style="color: var(--cream); font-weight: 600;">Quantity: <span th:text="${item.quantity}"></span></p>
                            </div>
                            <div class="col-md-2">
                                <p class="mb-0" style="color: var(--primary); font-weight: 700;">Subtotal: ₹<span th:text="${item.price}"></span></p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <p class="mb-0">Payment ID: <span class="payment-id" th:text="${order.paymentId}"></span></p>
                </div>
            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0"><i class="bi bi-c-circle me-1"></i>2025 SpayRa. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
