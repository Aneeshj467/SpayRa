<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Edit Product - SpayRa</title>
        <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' class='bi bi-gem' viewBox='0 0 16 16'><path d='M3.1.7a.5.5 0 0 1 .4-.2h9a.5.5 0 0 1 .4.2l2.976 3.974c.149.185.156.45.01.644L8.4 15.3a.5.5 0 0 1-.8 0L.1 5.118a.5.5 0 0 1 .01-.644L3.1.7zm11.386 3.785-1.806-2.41-.776 2.413 2.582-.003zm-3.633.004.961-2.989H4.186l.963 2.995 5.704-.006zM5.47 5.495 8 13.366l2.532-7.876-5.062.005zm-1.371-.999-.78-2.422-1.818 2.425 2.598-.003zM1.499 5.5l5.113 6.817-2.192-6.82L1.5 5.5zm7.889 6.817 5.123-6.83-2.928.002L13.387 12.317z'/></svg>" type="image/svg+xml">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
        <style>
            :root {
                --primary: #FFD700;
                --primary-dark: #DAA520;
                --secondary: #FFF8DC;
                --accent: #B8860B;
                --dark: #000000;
                --light: #1a1a1a;
                --gray: #CCCCCC;
                --gray-light: #2a2a2a;
                --body-bg: #000000;
                --card-bg: #1a1a1a;
                --border: #333333;
                --cream: #FFFFFF;
                --box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
                --box-shadow-lg: 0 20px 40px rgba(255, 215, 0, 0.25);
                --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            
            body {
                font-family: 'Montserrat', sans-serif;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                background: var(--body-bg);
                color: var(--cream);
                position: relative;
            }
            
            body::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
                animation: float 25s ease-in-out infinite;
                pointer-events: none;
                z-index: -1;
            }
            
            @keyframes float {
                0%, 100% { transform: translateY(0px) rotate(0deg); }
                50% { transform: translateY(-15px) rotate(180deg); }
            }
            
            .navbar {
                background: linear-gradient(135deg, rgba(0,0,0,0.95) 0%, rgba(26,26,26,0.95) 100%) !important;
                backdrop-filter: blur(20px);
                box-shadow: 0 4px 20px rgba(255, 215, 0, 0.1);
                border-bottom: 1px solid var(--border);
            }
            
            .navbar-brand {
                font-weight: 800;
                color: var(--primary) !important;
                font-size: 2rem;
                font-family: 'Playfair Display', serif;
                transition: var(--transition);
                text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
            }
            
            .navbar-brand:hover {
                transform: scale(1.05);
                color: var(--primary-dark) !important;
            }
            
            .nav-link {
                font-weight: 600;
                color: var(--gray) !important;
                transition: var(--transition);
                position: relative;
            }
            
            .nav-link:hover {
                color: var(--primary) !important;
                transform: translateY(-2px);
            }
            
            .nav-link::after {
                content: '';
                position: absolute;
                bottom: -5px;
                left: 50%;
                width: 0;
                height: 2px;
                background: var(--primary);
                transition: var(--transition);
                transform: translateX(-50%);
            }
            
            .nav-link:hover::after {
                width: 80%;
            }
            
            .footer {
                background: var(--dark);
                color: var(--cream);
                padding: 2rem 0;
                text-align: center;
                margin-top: auto;
                border-top: 1px solid var(--border);
            }
            
            .alert {
                border-radius: 15px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                border: none;
            }
            
            .alert-danger {
                background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
                color: var(--cream);
                border-left: 4px solid #EF4444;
            }
            
            .alert-success {
                background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
                color: var(--cream);
                border-left: 4px solid #10B981;
            }
            
            main {
                flex: 1 0 auto;
            }
            
            .form-container {
                max-width: 800px;
                margin: 0 auto;
                padding: 4rem 3rem;
                background: var(--card-bg);
                border-radius: 25px;
                box-shadow: var(--box-shadow-lg);
                border: 2px solid var(--border);
                transition: var(--transition);
                position: relative;
                overflow: hidden;
            }
            
            .form-container::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 4px;
                background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            }
            
            .form-container:hover {
                border-color: var(--primary);
                box-shadow: var(--box-shadow-lg);
            }
            
            .btn-primary {
                background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
                color: var(--dark);
                padding: 1.2rem 3rem;
                border-radius: 25px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 1px;
                transition: var(--transition);
                border: none;
                box-shadow: var(--box-shadow);
                position: relative;
                overflow: hidden;
            }
            
            .btn-primary::before {
                content: '';
                position: absolute;
                top: 0;
                left: -100%;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
                transition: left 0.5s;
            }
            
            .btn-primary:hover::before {
                left: 100%;
            }
            
            .btn-primary:hover {
                background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent) 100%);
                transform: translateY(-3px);
                box-shadow: var(--box-shadow-lg);
                color: var(--dark);
            }
            
            h1 {
                color: var(--cream);
                font-weight: 800;
                text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
                font-family: 'Playfair Display', serif;
                font-size: 2.5rem;
                margin-bottom: 2rem;
                position: relative;
            }
            
            h1::after {
                content: '';
                position: absolute;
                bottom: -10px;
                left: 50%;
                transform: translateX(-50%);
                width: 150px;
                height: 4px;
                background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
                border-radius: 2px;
            }
            
            .form-control {
                border-radius: 15px;
                border: 2px solid var(--border);
                padding: 1rem 1.2rem;
                transition: var(--transition);
                background: var(--gray-light);
                color: var(--cream);
                font-size: 1rem;
            }
            
            .form-control:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 0.3rem rgba(255, 215, 0, 0.25);
                background: var(--card-bg);
                color: var(--cream);
            }
            
            .form-control::placeholder {
                color: var(--gray);
            }
            
            .form-select {
                border-radius: 15px;
                border: 2px solid var(--border);
                padding: 1rem 1.2rem;
                transition: var(--transition);
                background: var(--gray-light);
                color: var(--cream);
            }
            
            .form-select:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 0.3rem rgba(255, 215, 0, 0.25);
                background: var(--card-bg);
                color: var(--cream);
            }
            
            .form-label {
                font-weight: 700;
                color: var(--cream);
                margin-bottom: 0.8rem;
                font-size: 1.1rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }
            
            .text-danger {
                color: #EF4444 !important;
                font-weight: 600;
                font-size: 0.9rem;
                margin-top: 0.5rem;
            }
            
            .img-thumbnail {
                border: 2px solid var(--primary);
                border-radius: 15px;
                background: var(--gray-light);
                padding: 10px;
                transition: var(--transition);
            }
            
            .img-thumbnail:hover {
                transform: scale(1.1);
                box-shadow: var(--box-shadow);
            }
            
            .current-image-section {
                background: rgba(255, 215, 0, 0.1);
                border-radius: 15px;
                padding: 1.5rem;
                margin-top: 1rem;
                border: 1px solid rgba(255, 215, 0, 0.2);
                text-align: center;
            }
            
            .luxury-divider {
                height: 2px;
                background: linear-gradient(90deg, transparent, var(--primary), transparent);
                margin: 2rem 0;
                border-radius: 1px;
            }
            
            @media (max-width: 768px) {
                .form-container {
                    margin: 1rem;
                    padding: 2.5rem 2rem;
                }
                
                h1 {
                    font-size: 2rem;
                }
                
                .navbar-brand {
                    font-size: 1.6rem;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg">
                <div class="container">
                    <a class="navbar-brand" href="/seller/home">
                        <i class="bi bi-gem me-2"></i>SpayRa Seller
                    </a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav"
                        aria-controls="navbarNav"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="/seller/add-product"
                                    ><i class="bi bi-plus-circle me-1"></i>Add Product</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/seller/manage-products"
                                    ><i class="bi bi-gear me-1"></i>Manage Products</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/logout"
                                    ><i class="bi bi-box-arrow-right me-1"></i>Logout</a
                                >
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container mt-4">
            <div
                class="container mt-4"
                th:if="${session.failure!=null || session.success!=null}"
            >
                <div
                    class="alert alert-danger alert-dismissible fade show"
                    th:if="${session.failure}"
                    role="alert"
                >
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    <span th:text="${session.failure}"></span>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                </div>
                <div
                    class="alert alert-success alert-dismissible fade show"
                    th:if="${session.success}"
                    role="alert"
                >
                    <i class="bi bi-check-circle me-2"></i>
                    <span th:text="${session.success}"></span>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                </div>
                <div th:text="${@sessionMessageRemover.removeMessage()}"></div>
            </div>

            <div class="container mt-4">
                <h1 class="text-center mb-4">
                    <i class="bi bi-pencil-square me-3"></i>Edit Luxury Product
                </h1>

                <div class="form-container">
                    <form
                        action="/seller/edit-product"
                        method="post"
                        enctype="multipart/form-data"
                        th:object="${product}"
                    >
                        <input type="hidden" name="id" th:value="*{id}">
                        
                        <div class="mb-4">
                            <label for="name" class="form-label">
                                <i class="bi bi-tag"></i>Product Name
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                name="name"
                                th:value="*{name}"
                                placeholder="Enter luxury product name"
                            />
                            <span class="text-danger" th:errors="*{name}"></span>
                        </div>
                        
                        <div class="mb-4">
                            <label for="price" class="form-label">
                                <i class="bi bi-currency-rupee"></i>Price
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="price"
                                name="price"
                                th:value="*{price}"
                                placeholder="Enter premium price"
                            />
                            <span class="text-danger" th:errors="*{price}"></span>
                        </div>
                        
                        <div class="mb-4">
                            <label for="stock" class="form-label">
                                <i class="bi bi-box"></i>Stock Quantity
                            </label>
                            <input
                                type="number"
                                class="form-control"
                                id="stock"
                                name="stock"
                                th:value="*{stock}"
                                placeholder="Enter available stock"
                            />
                            <span class="text-danger" th:errors="*{stock}"></span>
                        </div>
                        
                        <div class="mb-4">
                            <label for="description" class="form-label">
                                <i class="bi bi-file-text"></i>Product Description
                            </label>
                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="5"
                                placeholder="Describe your luxury product in detail"
                            ><th:block th:text="*{description}"></th:block></textarea>
                            <span class="text-danger" th:errors="*{description}"></span>
                        </div>
                        
                        <div class="mb-4">
                            <label for="image" class="form-label">
                                <i class="bi bi-image"></i>Product Image
                            </label>
                            <input
                                type="file"
                                class="form-control"
                                id="image"
                                name="image"
                                accept="image/*"
                            />
                            <div class="current-image-section">
                                <p style="color: var(--gray); margin-bottom: 1rem;">Current Product Image:</p>
                                <img th:alt="*{name}" th:src="*{imageLink}" height="120px" width="120px" class="img-thumbnail">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="category" class="form-label">
                                <i class="bi bi-grid"></i>Category
                            </label>
                            <select
                                class="form-select"
                                id="category"
                                name="category"
                                th:value="*{category}"
                            >
                                <option value="Electronics">Electronics</option>
                                <option value="Fashion">Fashion</option>
                                <option value="Cosmetics">Cosmetics</option>
                                <option value="Toys">Toys</option>
                                <option value="Jewelry">Jewelry</option>
                                <option value="Watches">Watches</option>
                                <option value="Home & Decor">Home & Decor</option>
                            </select>
                            <span class="text-danger" th:errors="*{category}"></span>
                        </div>
                        
                        <div class="luxury-divider"></div>
                        
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-gem me-2"></i>Update Luxury Product
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="container">
                <p class="mb-0">
                    <i class="bi bi-c-circle me-1"></i>2025 SpayRa. Luxury Redefined.
                </p>
            </div>
        </footer>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                setTimeout(function () {
                    var alerts = document.querySelectorAll(".alert");
                    alerts.forEach(function (alert) {
                        var bsAlert = new bootstrap.Alert(alert);
                        bsAlert.close();
                    });
                }, 2000);
                
                // Form field animations
                const inputs = document.querySelectorAll('.form-control, .form-select');
                inputs.forEach(input => {
                    input.addEventListener('focus', function() {
                        this.style.transform = 'scale(1.02)';
                    });
                    
                    input.addEventListener('blur', function() {
                        this.style.transform = 'scale(1)';
                    });
                });
            });
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
