<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order Confirmation - SpayRa</title>
<link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='currentColor' class='bi bi-gem' viewBox='0 0 16 16'><path d='M3.1.7a.5.5 0 0 1 .4-.2h9a.5.5 0 0 1 .4.2l2.976 3.974c.149.185.156.45.01.644L8.4 15.3a.5.5 0 0 1-.8 0L.1 5.118a.5.5 0 0 1 .01-.644L3.1.7zm11.386 3.785-1.806-2.41-.776 2.413 2.582-.003zm-3.633.004.961-2.989H4.186l.963 2.995 5.704-.006zM5.47 5.495 8 13.366l2.532-7.876-5.062.005zm-1.371-.999-.78-2.422-1.818 2.425 2.598-.003zM1.499 5.5l5.113 6.817-2.192-6.82L1.5 5.5zm7.889 6.817 5.123-6.83-2.928.002L13.387 12.317z'/></svg>" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
<style>
:root {
  --primary: #FFD700;
  --primary-dark: #DAA520;
  --secondary: #FFF8DC;
  --accent: #B8860B;
  --dark: #000000;
  --light: #1a1a1a;
  --gray: #CCCCCC;
  --gray-light: #2a2a2a;
  --body-bg: #000000;
  --card-bg: #1a1a1a;
  --border: #333333;
  --cream: #FFFFFF;
  --box-shadow: 0 8px 32px rgba(255, 215, 0, 0.15);
  --box-shadow-lg: 0 20px 40px rgba(255, 215, 0, 0.25);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

body {
  font-family: 'Montserrat', sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--body-bg);
  color: var(--cream);
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
  pointer-events: none;
  z-index: -1;
}

main {
  flex: 1 0 auto;
  padding: 2rem 0;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: var(--dark);
  padding: 1.2rem 3rem;
  border-radius: 25px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  transition: var(--transition);
  border: none;
  box-shadow: var(--box-shadow);
  position: relative;
  overflow: hidden;
  font-size: 1.1rem;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn-primary:hover::before {
  left: 100%;
}

.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent) 100%);
  transform: translateY(-3px) scale(1.05);
  box-shadow: var(--box-shadow-lg);
  color: var(--dark);
}

.cart-item {
  transition: var(--transition);
  margin-bottom: 20px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--box-shadow);
  background: var(--card-bg);
  border: 2px solid var(--border);
}

.cart-item:hover {
  transform: translateY(-5px);
  box-shadow: var(--box-shadow-lg);
  border-color: var(--primary);
}

.product-image {
  width: 100px;
  height: 100px;
  object-fit: contain;
  border-radius: 15px;
  background: var(--gray-light);
  padding: 10px;
}

.footer {
  background: var(--dark);
  color: var(--cream);
  padding: 2rem 0;
  text-align: center;
  margin-top: auto;
  border-top: 1px solid var(--border);
}

.card {
  border-radius: 20px;
  box-shadow: var(--box-shadow);
  border: 2px solid var(--border);
  background: var(--card-bg);
  overflow: hidden;
}

.card-body {
  background: var(--card-bg);
  color: var(--cream);
}

h1 {
  color: var(--cream);
  font-weight: 800;
  font-family: 'Playfair Display', serif;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  margin-bottom: 3rem;
  position: relative;
}

h1::after {
  content: '';
  position: absolute;
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 4px;
  background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius: 2px;
}

h5 {
  color: var(--cream);
  font-weight: 700;
  font-family: 'Playfair Display', serif;
}

h4 {
  color: var(--cream);
  font-weight: 700;
}

.text-muted {
  color: var(--gray) !important;
}

.fw-bold {
  color: var(--primary) !important;
  font-weight: 700 !important;
}

.badge {
  background: var(--primary) !important;
  color: var(--dark) !important;
  font-weight: 600;
  padding: 0.5rem 1rem;
  border-radius: 15px;
}

.payment-section {
  background: linear-gradient(135deg, var(--card-bg) 0%, var(--light) 100%);
  border-radius: 20px;
  padding: 2rem;
  border: 2px solid var(--border);
  position: relative;
  overflow: hidden;
}

.payment-section::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}

.total-amount {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary);
  text-shadow: 0 2px 4px rgba(255, 215, 0, 0.3);
  font-family: 'Playfair Display', serif;
}

.luxury-divider {
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  margin: 2rem 0;
  border-radius: 1px;
}

.confirmation-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: var(--dark);
  padding: 2rem;
  border-radius: 20px 20px 0 0;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.confirmation-header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 100%;
  height: 200%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
  animation: headerPulse 4s ease-in-out infinite;
}

@keyframes headerPulse {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 0.8; }
}

.confirmation-header h1 {
  color: var(--dark);
  text-shadow: none;
  margin: 0;
  position: relative;
  z-index: 2;
}

.confirmation-header h1::after {
  display: none;
}

@media (max-width: 768px) {
  .btn-primary {
    padding: 1rem 2rem;
    font-size: 1rem;
  }
  
  .product-image {
    width: 80px;
    height: 80px;
  }
  
  .payment-section {
    padding: 1.5rem;
  }
}
</style>
</head>

<body>
  
<main class="container mt-5">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <div class="card shadow-lg">
        <div class="confirmation-header">
          <h1 class="display-5"><i class="bi bi-gem me-3"></i>Luxury Order Confirmation</h1>
          <p style="margin: 0; font-weight: 600; font-size: 1.1rem;">SpayRa Premium Experience</p>
        </div>
        <div class="card-body">
          <div class="card shadow-sm mb-4" th:each="item : ${cart.items}">
              <div class="card-body cart-item">
                  <div class="row align-items-center">
                      <div class="col-md-2">
                          <img class="product-image" th:src="${item.imageLink}" th:alt="${item.name}" />
                      </div>
                      <div class="col-md-4">
                          <h5 th:text="${item.name}">Luxury Product</h5>
                          <p class="text-muted" th:text="${item.description}">Premium description</p>
                          <span class="badge bg-primary" th:text="${item.category}">Category</span>
                      </div>
                      <div class="col-md-2">
                          <p class="fw-bold" th:text="'₹' + ${item.price/item.quantity}">₹0</p>
                      </div>
                      <div class="col-md-2">
                          <div class="d-flex align-items-center justify-content-center">
                              <span class="fw-bold" style="color: var(--cream); font-size: 1.1rem;" th:text="${item.quantity}">1</span>
                          </div>
                      </div>
                      <div class="col-md-2">
                          <p class="fw-bold" th:text="'₹' + ${item.quantity * item.price/item.quantity}">₹0</p>
                      </div>
                  </div>
              </div>
          </div>
          
          <div class="luxury-divider"></div>
          
          <div class="payment-section text-center">
              <h4 style="color: var(--cream); margin-bottom: 1rem;">Total Investment</h4>
              <div class="total-amount mb-4" th:text="'₹' + ${customer.cart.price}">₹0</div>
              <p style="color: var(--gray); margin-bottom: 2rem;">Secure your luxury items with our premium payment gateway</p>
              <button id="rzp-button1" class="btn btn-primary">
                  <i class="bi bi-gem me-2"></i>Complete Luxury Purchase
              </button>
              <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(255, 215, 0, 0.1); border-radius: 15px; border-left: 4px solid var(--primary);">
                <p style="color: var(--cream); margin: 0; font-size: 0.9rem;">🔒 Your transaction is secured with enterprise-grade encryption</p>
              </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
      <p class="mb-0"><i class="bi bi-c-circle me-1"></i>2025 SpayRa. Luxury Redefined.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:inline="javascript">
  var options = {
    "key": /*[[${key}]]*/,
    "amount": /*[[${totalAmount * 100}]]*/,
    "currency": "INR",
    "name": "SpayRa",
    "description": "Premium Luxury Marketplace",
    "image": "/images/spayra-logo.jpg",
    "order_id": /*[[${orderId}]]*/,
    "callback_url": "/customer/confirm-order/[[${id}]]",
    "prefill": {
      "name": /*[[${customer.name}]]*/,
      "email": /*[[${customer.email}]]*/,
      "contact": /*[['+91'+${customer.mobile}]]*/
    },
    "notes": {
      "address": "SpayRa Luxury Corporate Office"
    },
    "theme": {
      "color": "#FFD700"
    },
    "modal": {
      "ondismiss": function(){
        console.log('Payment modal closed');
      }
    }
  };
  
  var rzp1 = new Razorpay(options);
  
  rzp1.on('payment.failed', function (response){
    alert('Payment Failed: ' + response.error.description);
  });
  
  document.getElementById('rzp-button1').onclick = function(e) {
    rzp1.open();
    e.preventDefault();
  }
  
  // Add button animation on click
  document.getElementById('rzp-button1').addEventListener('click', function() {
    this.style.transform = 'scale(0.95)';
    setTimeout(() => {
      this.style.transform = '';
    }, 150);
  });
</script>
</body>

</html>
